name: Dispatch ACS Render recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/acs-dispatch-recovery.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch recovery workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/acs-render-recovery.yml/dispatches \
            -d '{"ref":"main"}'
