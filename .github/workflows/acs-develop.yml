name: ACS develop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'db/**'
      - 'package.json'
      - '.github/workflows/acs-develop.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: acs-develop-main
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VERCEL_TEAM_ID: team_KrFJ87iJN82qsZ56d8eKsvqJ
      NEON_PROJECT_ID: falling-unit-68011930
      VERCEL_PROJECT_NAME: acs
      RENDER_SERVICE_NAME: acs
      SITE_URL: https://acastilho.com.br

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare status reporter
        shell: bash
        run: |
          cat > /tmp/status.mjs <<'NODE'
          const [state, context, description, target] = process.argv.slice(2);
          const body={state,context,description:String(description||'').slice(0,140)};
          if(target) body.target_url=target;
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`,{
            method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)
          });
          if(!r.ok) throw new Error(`github-status-${r.status}`);
          NODE
          node /tmp/status.mjs pending acs/develop 'ACS validation and controlled deployment started'

      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in VERCEL_TOKEN RENDER_API_KEY NEON_API_KEY; do
            test -n "${!key:-}" || { node /tmp/status.mjs failure acs/credentials "$key missing"; exit 1; }
          done
          node /tmp/status.mjs success acs/credentials 'Deployment credentials available'

      - name: Build production bundle
        shell: bash
        env:
          NEXT_PUBLIC_SITE_URL: https://acastilho.com.br
        run: |
          set -euo pipefail
          npm install
          npm run build
          node /tmp/status.mjs success acs/build 'Next.js production build passed'

      - name: Resolve and verify Neon
        shell: bash
        run: |
          set -euo pipefail
          cat > .acs-neon.mjs <<'NODE'
          import fs from 'node:fs';
          import { neon } from '@neondatabase/serverless';
          const q=new URLSearchParams({database_name:'neondb',role_name:'neondb_owner',pooled:'true'});
          const r=await fetch(`https://console.neon.tech/api/v2/projects/${process.env.NEON_PROJECT_ID}/connection_uri?${q}`,{
            headers:{Authorization:`Bearer ${process.env.NEON_API_KEY}`,Accept:'application/json'}
          });
          const data=await r.json().catch(()=>({}));
          if(!r.ok || !data.uri) throw new Error(`Neon connection URI failed: ${r.status}`);
          console.log(`::add-mask::${data.uri}`);
          const sql=neon(data.uri);
          const rows=await sql`select to_regclass('public.contact_leads')::text as table_name, (select count(*)::int from public.contact_leads) as total_leads`;
          if(!rows[0]?.table_name) throw new Error('contact_leads table missing');
          fs.appendFileSync(process.env.GITHUB_ENV,`ACS_DATABASE_URL=${data.uri}\n`);
          console.log(`Neon verified; preserved rows=${rows[0].total_leads}`);
          NODE
          node .acs-neon.mjs
          rm -f .acs-neon.mjs
          node /tmp/status.mjs success acs/neon 'Existing Neon database verified and preserved'

      - name: Deploy Vercel once
        id: vercel
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/vercel.mjs <<'NODE'
          import fs from 'node:fs';
          const token=process.env.VERCEL_TOKEN, team=process.env.VERCEL_TEAM_ID, name=process.env.VERCEL_PROJECT_NAME;
          async function req(path,init={}){
            const r=await fetch(`https://api.vercel.com${path}`,{...init,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(init.headers||{})}});
            const text=await r.text(); let data={}; try{data=text?JSON.parse(text):{}}catch{data={message:text}}
            if(!r.ok) throw new Error(`Vercel ${r.status}: ${data?.error?.message||data.message||text}`);
            return data;
          }
          let project;
          const lookup=await fetch(`https://api.vercel.com/v9/projects/${name}?teamId=${team}`,{headers:{Authorization:`Bearer ${token}`}});
          if(lookup.ok) project=await lookup.json();
          else if(lookup.status===404) project=await req(`/v11/projects?teamId=${team}`,{method:'POST',body:JSON.stringify({name,skipGitConnectDuringLink:true})});
          else throw new Error(`Vercel lookup ${lookup.status}`);
          await req(`/v10/projects/${project.id}/env?upsert=true&teamId=${team}`,{method:'POST',body:JSON.stringify([
            {key:'DATABASE_URL',value:process.env.ACS_DATABASE_URL,type:'encrypted',target:['production','preview']},
            {key:'NEXT_PUBLIC_SITE_URL',value:process.env.SITE_URL,type:'encrypted',target:['production','preview']}
          ])});
          fs.mkdirSync('.vercel',{recursive:true});
          fs.writeFileSync('.vercel/project.json',JSON.stringify({projectId:project.id,orgId:team}));
          NODE
          node /tmp/vercel.mjs
          set +e
          output="$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" -T "$VERCEL_TEAM_ID" 2>&1)"; rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then node /tmp/status.mjs failure acs/vercel 'Vercel deployment failed'; exit "$rc"; fi
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -1 || true)"
          test -n "$url"
          echo "VERCEL_URL=$url" >> "$GITHUB_ENV"
          node /tmp/status.mjs success acs/vercel 'ACS deployed to Vercel' "$url"

      - name: Deploy Render once
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/render.mjs <<'NODE'
          import fs from 'node:fs';
          const token=process.env.RENDER_API_KEY, name=process.env.RENDER_SERVICE_NAME, api='https://api.render.com/v1';
          async function req(path,init={}){
            const r=await fetch(api+path,{...init,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(init.headers||{})}});
            const text=await r.text(); let data={}; try{data=text?JSON.parse(text):{}}catch{data={message:text}}
            if(!r.ok) throw new Error(`Render ${r.status}: ${data.message||JSON.stringify(data)}`);
            return data;
          }
          const owners=await req('/owners?limit=100');
          const row=Array.isArray(owners)?owners[0]:owners?.data?.[0];
          const ownerId=row?.owner?.id||row?.id; if(!ownerId) throw new Error('Render workspace missing');
          const listed=await req('/services?limit=100');
          const rows=Array.isArray(listed)?listed:(listed?.data||listed?.services||[]);
          let service=rows.map(x=>x.service||x).find(x=>x?.name===name);
          let created=false;
          if(!service){
            const out=await req('/services',{method:'POST',body:JSON.stringify({
              type:'web_service',name,ownerId,repo:'https://github.com/a-castilho/a-castilho-site',branch:'main',autoDeploy:'no',
              envVars:[{key:'DATABASE_URL',value:process.env.ACS_DATABASE_URL},{key:'NEXT_PUBLIC_SITE_URL',value:process.env.SITE_URL}],
              serviceDetails:{runtime:'node',plan:'free',healthCheckPath:'/',envSpecificDetails:{buildCommand:'npm install && npm run build',startCommand:'npm start'}}
            })});
            service=out?.service||out; created=true;
          }else{
            await req(`/services/${service.id}/env-vars/DATABASE_URL`,{method:'PUT',body:JSON.stringify({value:process.env.ACS_DATABASE_URL})});
            await req(`/services/${service.id}/env-vars/NEXT_PUBLIC_SITE_URL`,{method:'PUT',body:JSON.stringify({value:process.env.SITE_URL})});
            await req(`/services/${service.id}/deploys`,{method:'POST',body:JSON.stringify({clearCache:'do_not_clear'})});
          }
          if(!service?.id) throw new Error('Render service id missing');
          let detail=await req(`/services/${service.id}`); detail=detail?.service||detail;
          const url=detail?.url||detail?.serviceDetails?.url||`https://${name}.onrender.com`;
          let ok=false, code=0;
          for(let i=0;i<30;i++){
            try{const r=await fetch(url,{redirect:'follow'});code=r.status;if(r.ok){ok=true;break}}catch{}
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!ok) throw new Error(`Render not live: HTTP ${code||'unreachable'}`);
          fs.appendFileSync(process.env.GITHUB_ENV,`RENDER_URL=${url}\n`);
          console.log(`${created?'created':'redeployed'} ${url}`);
          NODE
          if node /tmp/render.mjs; then
            node /tmp/status.mjs success acs/render 'ACS deployed to Render' "https://acs.onrender.com"
          else
            node /tmp/status.mjs failure acs/render 'Render deployment failed'; exit 1
          fi

      - name: Smoke test
        if: steps.vercel.outcome == 'success' && steps.render.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for base in "$VERCEL_URL" "$RENDER_URL"; do
            curl -fsSL --retry 3 --retry-delay 2 "$base" >/dev/null
            body="$(curl -fsSL --retry 3 --retry-delay 2 -X POST "$base/api/contact" -H 'Content-Type: application/json' --data '{"website":"validation-bot"}')"
            printf '%s' "$body" | grep -q '"ok":true'
          done
          node /tmp/status.mjs success acs/smoke 'Public Vercel and Render smoke tests passed'

      - name: Final status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.vercel.outcome }}" = success ] && [ "${{ steps.render.outcome }}" = success ]; then
            node /tmp/status.mjs success acs/develop 'ACS deployed successfully to Neon, Vercel and Render'
          else
            node /tmp/status.mjs failure acs/develop 'ACS deployment incomplete; inspect platform checks'
            exit 1
          fi
