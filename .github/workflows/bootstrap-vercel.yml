name: Provision database and deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_ORG_ID: ${{ vars.NEON_ORG_ID }}
      NEON_PROJECT_NAME: ${{ github.event.repository.name }}
      VERCEL_TEAM_ID: team_KrFJ87iJN82qsZ56d8eKsvqJ
      VERCEL_ORG_ID: team_KrFJ87iJN82qsZ56d8eKsvqJ
      VERCEL_PROJECT_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare pipeline status reporter
        shell: bash
        run: |
          cat > /tmp/post-status <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          state="$1"
          context="$2"
          description="$3"
          target="${4:-}"
          payload=$(node -e '
            const body={state:process.argv[1],context:process.argv[2],description:process.argv[3]};
            if(process.argv[4]) body.target_url=process.argv[4];
            process.stdout.write(JSON.stringify(body));
          ' "$state" "$context" "$description" "$target")
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null
          EOF
          chmod +x /tmp/post-status
          /tmp/post-status pending automation/pipeline "Automatic database provisioning and deploy started"

      - name: Validate required credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { /tmp/post-status failure failure/missing-vercel-token "VERCEL_TOKEN missing"; exit 1; }
          /tmp/post-status success automation/secrets "Vercel automation credential available"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Provision or reuse Vercel project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_RESPONSE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$PROJECT_RESPONSE" -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?teamId=$VERCEL_TEAM_ID")

          if [ "$HTTP_CODE" = "404" ]; then
            printf '{"name":"%s","framework":"nextjs"}' "$VERCEL_PROJECT_NAME" > /tmp/vercel-project.json
            HTTP_CODE=$(curl -sS -o "$PROJECT_RESPONSE" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vercel-project.json \
              "https://api.vercel.com/v11/projects?teamId=$VERCEL_TEAM_ID")
          fi

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            /tmp/post-status failure "failure/vercel-project-http-$HTTP_CODE" "Vercel project provisioning failed"
            exit 1
          fi

          VERCEL_PROJECT_ID=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(!x.id) process.exit(2); process.stdout.write(x.id)" "$PROJECT_RESPONSE")
          echo "VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID" >> "$GITHUB_ENV"
          mkdir -p .vercel
          node -e "const fs=require('fs'); fs.writeFileSync('.vercel/project.json', JSON.stringify({projectId:process.argv[1],orgId:process.argv[2]}))" "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID"
          /tmp/post-status success "automation/project-$VERCEL_PROJECT_ID" "Vercel project identified"

      - name: Pull Vercel project configuration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" -T "$VERCEL_TEAM_ID" >/dev/null
          /tmp/post-status success automation/vercel-link "Vercel project linked"

      - name: Resolve database automatically
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$NEON_API_KEY" ] && [ -n "$NEON_ORG_ID" ]; then
            npm install -g neon@latest >/dev/null

            neon projects list \
              --org-id "$NEON_ORG_ID" \
              --output json > /tmp/neon-projects.json

            NEON_PROJECT_ID=$(node - "$NEON_PROJECT_NAME" <<'EOF'
          const fs = require('fs');
          const name = process.argv[2];
          const x = JSON.parse(fs.readFileSync('/tmp/neon-projects.json', 'utf8'));
          const rows = Array.isArray(x) ? x : (x.projects || x.data || []);
          const project = rows.find((item) => item && item.name === name);
          if (project?.id) process.stdout.write(project.id);
          EOF
            )

            if [ -z "$NEON_PROJECT_ID" ]; then
              neon projects create \
                --name "$NEON_PROJECT_NAME" \
                --org-id "$NEON_ORG_ID" \
                --database neondb \
                --role neondb_owner \
                --output json > /tmp/neon-created.json

              NEON_PROJECT_ID=$(node <<'EOF'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/neon-created.json', 'utf8'));
          const project = x.project || x;
          if (!project?.id) process.exit(2);
          process.stdout.write(project.id);
          EOF
              )
              /tmp/post-status success automation/neon-created "Neon project created through Neon API"
            else
              /tmp/post-status success automation/neon-reused "Existing Neon project reused through Neon API"
            fi

            DATABASE_URL=$(neon connection-string \
              --project-id "$NEON_PROJECT_ID" \
              --database-name neondb \
              --role-name neondb_owner \
              --pooled)

            test -n "$DATABASE_URL"
            echo "::add-mask::$DATABASE_URL"
            export DATABASE_URL

            node --input-type=module > /tmp/vercel-env.json <<'EOF'
          process.stdout.write(JSON.stringify([{
            key: 'DATABASE_URL',
            value: process.env.DATABASE_URL,
            type: 'encrypted',
            target: ['production', 'preview']
          }]));
          EOF

            ENV_HTTP=$(curl -sS -o /tmp/vercel-env-response.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vercel-env.json \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_TEAM_ID")

            if [ "$ENV_HTTP" != "200" ] && [ "$ENV_HTTP" != "201" ]; then
              /tmp/post-status failure "failure/vercel-env-http-$ENV_HTTP" "Vercel DATABASE_URL configuration failed"
              exit 1
            fi

            {
              echo 'DATABASE_URL<<__DATABASE_URL__'
              echo "$DATABASE_URL"
              echo '__DATABASE_URL__'
              echo "NEON_PROJECT_ID=$NEON_PROJECT_ID"
            } >> "$GITHUB_ENV"

            /tmp/post-status success automation/database-source-neon-api "Database resolved through Neon API"
            exit 0
          fi

          RESOURCE_NAME="${VERCEL_PROJECT_NAME}-db"

          set +e
          CONNECT_OUTPUT=$(timeout 60s npx --yes vercel@latest integration resource connect \
            "$RESOURCE_NAME" "$VERCEL_PROJECT_NAME" \
            --yes --format=json --non-interactive \
            --token="$VERCEL_TOKEN" -T "$VERCEL_TEAM_ID" 2>&1)
          CONNECT_RC=$?
          set -e

          if [ "$CONNECT_RC" -ne 0 ]; then
            set +e
            ADD_OUTPUT=$(timeout 60s npx --yes vercel@latest integration add neon \
              --name "$RESOURCE_NAME" \
              --plan free \
              -e production -e preview \
              --format=json --non-interactive \
              --token="$VERCEL_TOKEN" -T "$VERCEL_TEAM_ID" 2>&1)
            ADD_RC=$?
            set -e

            if [ "$ADD_RC" -ne 0 ]; then
              ERR=$(printf '%s\n' "$ADD_OUTPUT" | grep -Ei 'error|failed|forbidden|unauthorized|terms|permission|limit' | tail -n 1 || true)
              [ -n "$ERR" ] || ERR=$(printf '%s\n' "$ADD_OUTPUT" | tail -n 1)
              SLUG=$(printf '%s' "$ERR" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-55)
              [ -n "$SLUG" ] || SLUG=unknown
              /tmp/post-status failure "failure/neon-marketplace-$SLUG" "Vercel Marketplace Neon provisioning failed"
              exit "$ADD_RC"
            fi

            /tmp/post-status success automation/neon-marketplace-created "Vercel Marketplace Neon resource created"
          else
            /tmp/post-status success automation/neon-marketplace-reused "Vercel Marketplace Neon resource reused"
          fi

          rm -f /tmp/vercel-neon.env
          npx --yes vercel@latest env pull /tmp/vercel-neon.env \
            --environment=production \
            --token="$VERCEL_TOKEN" -T "$VERCEL_TEAM_ID" >/dev/null

          unset DATABASE_URL POSTGRES_URL NEON_DATABASE_URL
          set -a
          source /tmp/vercel-neon.env
          set +a

          DATABASE_URL="${DATABASE_URL:-${POSTGRES_URL:-${NEON_DATABASE_URL:-}}}"
          if [ -z "$DATABASE_URL" ]; then
            /tmp/post-status failure failure/neon-marketplace-no-database-url "Neon integration did not provide a database URL"
            exit 1
          fi

          echo "::add-mask::$DATABASE_URL"
          {
            echo 'DATABASE_URL<<__DATABASE_URL__'
            echo "$DATABASE_URL"
            echo '__DATABASE_URL__'
          } >> "$GITHUB_ENV"

          /tmp/post-status success automation/database-source-vercel-neon "Database resolved through Vercel Neon integration"

      - name: Install application dependencies
        run: npm install

      - name: Apply schema and verify database
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import { neon } from '@neondatabase/serverless';

          if (!process.env.DATABASE_URL) throw new Error('DATABASE_URL is empty');
          const sql = neon(process.env.DATABASE_URL);

          if (fs.existsSync('db/schema.sql')) {
            const source = fs.readFileSync('db/schema.sql', 'utf8');
            const statements = source
              .split(';')
              .map((statement) => statement.trim())
              .filter(Boolean);

            for (const statement of statements) {
              await sql.query(statement);
            }
          }

          const rows = await sql`select 1 as ok`;
          if (!rows?.[0] || Number(rows[0].ok) !== 1) {
            throw new Error('Database verification failed');
          }
          EOF
          /tmp/post-status success automation/database "Schema applied and database verified"

      - name: Validate application build
        shell: bash
        run: |
          set -euo pipefail
          NEXT_PUBLIC_SITE_URL=https://acastilho.com.br npm run build
          /tmp/post-status success automation/build "Next.js production build passed"

      - name: Build Vercel artifact
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" -T "$VERCEL_TEAM_ID" >/dev/null
          /tmp/post-status success automation/vercel-pull "Vercel production configuration pulled"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN" -T "$VERCEL_TEAM_ID"
          test -d .vercel/output
          /tmp/post-status success automation/vercel-build "Vercel production artifact built"

      - name: Deploy prebuilt production artifact
        shell: bash
        run: |
          set -euo pipefail
          HIDDEN_GIT=""
          restore_git() {
            if [ -n "$HIDDEN_GIT" ] && [ -d "$HIDDEN_GIT" ] && [ ! -e .git ]; then mv "$HIDDEN_GIT" .git; fi
          }
          trap restore_git EXIT
          if [ -d .git ]; then
            HIDDEN_GIT="/tmp/vercel-hidden-git-${GITHUB_RUN_ID:-$$}"
            rm -rf "$HIDDEN_GIT"
            mv .git "$HIDDEN_GIT"
          fi

          set +e
          OUTPUT=$(timeout 180s npx --yes vercel@latest deploy \
            --prebuilt --prod --yes --no-color \
            --token="$VERCEL_TOKEN" -T "$VERCEL_TEAM_ID" 2>&1)
          RC=$?
          set -e

          if [ "$RC" -ne 0 ]; then
            if [ "$RC" = "124" ]; then
              /tmp/post-status failure failure/deploy-timeout "Vercel deployment timed out"
              exit "$RC"
            fi
            ERROR_LINE=$(printf '%s\n' "$OUTPUT" | grep -Ei 'error|failed|forbidden|unauthorized|limit|permission|access' | tail -n 1 || true)
            [ -n "$ERROR_LINE" ] || ERROR_LINE=$(printf '%s\n' "$OUTPUT" | tail -n 1)
            SLUG=$(printf '%s' "$ERROR_LINE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-55)
            [ -n "$SLUG" ] || SLUG=unknown
            /tmp/post-status failure "failure/deploy-$SLUG" "Vercel production deployment failed"
            exit "$RC"
          fi

          DEPLOYMENT_URL=$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)
          if [ -z "$DEPLOYMENT_URL" ]; then
            /tmp/post-status failure failure/deploy-no-url "Deployment completed without a Vercel URL"
            exit 1
          fi

          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
          echo "- Production: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          /tmp/post-status success automation/deploy "Production deployment created" "$DEPLOYMENT_URL"

      - name: Validate production health
        shell: bash
        run: |
          set -euo pipefail
          LAST_STATUS=000
          for i in {1..10}; do
            LAST_STATUS=$(curl -L -sS -o /tmp/health.json -w "%{http_code}" "$DEPLOYMENT_URL/api/health" || true)
            if [ "$LAST_STATUS" = "200" ]; then
              /tmp/post-status success automation/health "Production health check passed" "$DEPLOYMENT_URL/api/health"
              /tmp/post-status success automation/pipeline "Production deploy and health check passed" "$DEPLOYMENT_URL"
              echo "- Health: passed" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done

          DB_STATE=$(node -e "const fs=require('fs'); try { const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8')); process.stdout.write(String(x.database||x.error||'unknown')); } catch { process.stdout.write('unknown'); }" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | cut -c1-35)
          [ -n "$DB_STATE" ] || DB_STATE=unknown
          /tmp/post-status failure "failure/health-$DB_STATE-http-$LAST_STATUS" "Production health check failed" "$DEPLOYMENT_URL/api/health"
          exit 1

      - name: Mark pipeline failure
        if: failure()
        shell: bash
        run: |
          /tmp/post-status failure automation/pipeline "Automatic deploy failed; inspect failure context"
