name: Provision and deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-production-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_TEAM_ID: team_KrFJ87iJN82qsZ56d8eKsvqJ
      VERCEL_TEAM_SLUG: maquina-de-leads1
      VERCEL_PROJECT_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Missing GitHub secret: VERCEL_TOKEN" && exit 1)
          test -n "$DATABASE_URL" || (echo "Missing GitHub secret: DATABASE_URL" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel tooling
        run: npm install --no-save @vercel/sdk@latest vercel@latest

      - name: Create or reuse Vercel project and configure environment
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { Vercel } from '@vercel/sdk';
          import fs from 'node:fs';

          const vercel = new Vercel({ bearerToken: process.env.VERCEL_TOKEN });
          const teamId = process.env.VERCEL_TEAM_ID;
          const slug = process.env.VERCEL_TEAM_SLUG;
          const name = process.env.VERCEL_PROJECT_NAME;

          let project;
          try {
            const existing = await vercel.projects.getProject({ teamId, slug, idOrName: name });
            project = existing.value ?? existing;
          } catch {
            const created = await vercel.projects.createProject({
              teamId,
              slug,
              requestBody: {
                name,
                framework: 'nextjs'
              }
            });
            project = created.value ?? created;
          }

          if (!project?.id) throw new Error('Vercel project unavailable or missing project id.');

          await vercel.projects.createProjectEnv({
            teamId,
            slug,
            idOrName: project.id,
            upsert: 'true',
            requestBody: [
              {
                key: 'DATABASE_URL',
                value: process.env.DATABASE_URL,
                type: 'encrypted',
                target: ['production', 'preview']
              }
            ]
          });

          fs.mkdirSync('.vercel', { recursive: true });
          fs.writeFileSync('.vercel/project.json', JSON.stringify({
            projectId: project.id,
            orgId: teamId
          }));

          fs.appendFileSync(process.env.GITHUB_ENV, `VERCEL_PROJECT_ID=${project.id}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Vercel provisioning\n\n` +
            `- Project: **${name}**\n` +
            `- Project ID: \`${project.id}\`\n` +
            `- Repository: \`${process.env.GITHUB_REPOSITORY}\`\n`
          );
          EOF

      - name: Pull production configuration
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_TEAM_SLUG"

      - name: Build production artifact
        run: npx vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_TEAM_SLUG"

      - name: Deploy production
        shell: bash
        run: |
          DEPLOYMENT_URL=$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_TEAM_SLUG")
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
          echo "- Production: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment URL: $DEPLOYMENT_URL"

      - name: Validate production health
        shell: bash
        run: |
          for i in {1..30}; do
            STATUS=$(curl -L -sS -o /tmp/health.json -w "%{http_code}" "$DEPLOYMENT_URL/api/health" || true)
            if [ "$STATUS" = "200" ]; then
              cat /tmp/health.json
              echo "- Health: ✅" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS"
            sleep 10
          done
          echo "Health check failed for $DEPLOYMENT_URL"
          exit 1
