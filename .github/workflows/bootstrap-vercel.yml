name: Provision and deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: vercel-production-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_TEAM_ID: team_KrFJ87iJN82qsZ56d8eKsvqJ
      VERCEL_ORG_ID: team_KrFJ87iJN82qsZ56d8eKsvqJ
      VERCEL_PROJECT_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare pipeline status reporter
        shell: bash
        run: |
          cat > /tmp/post-status <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          state="$1"
          context="$2"
          description="$3"
          payload=$(node -e 'process.stdout.write(JSON.stringify({state:process.argv[1],context:process.argv[2],description:process.argv[3]}))' "$state" "$context" "$description")
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null
          EOF
          chmod +x /tmp/post-status
          /tmp/post-status pending automation/pipeline "Automatic provisioning and deploy started"

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { /tmp/post-status failure failure/missing-vercel-token "VERCEL_TOKEN missing"; exit 1; }
          test -n "$DATABASE_URL" || { /tmp/post-status failure failure/missing-database-url "DATABASE_URL missing"; exit 1; }
          /tmp/post-status success automation/secrets "Deployment secrets available"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Provision Vercel project and environment
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_RESPONSE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$PROJECT_RESPONSE" -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?teamId=$VERCEL_TEAM_ID")

          if [ "$HTTP_CODE" = "404" ]; then
            printf '{"name":"%s","framework":"nextjs"}' "$VERCEL_PROJECT_NAME" > /tmp/vercel-project.json
            HTTP_CODE=$(curl -sS -o "$PROJECT_RESPONSE" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/vercel-project.json \
              "https://api.vercel.com/v11/projects?teamId=$VERCEL_TEAM_ID")
          fi

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            /tmp/post-status failure "failure/vercel-project-http-$HTTP_CODE" "Vercel project provisioning failed"
            cat "$PROJECT_RESPONSE"
            exit 1
          fi

          VERCEL_PROJECT_ID=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(!x.id) process.exit(2); process.stdout.write(x.id)" "$PROJECT_RESPONSE")
          echo "VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID" >> "$GITHUB_ENV"
          mkdir -p .vercel
          node -e "const fs=require('fs'); fs.writeFileSync('.vercel/project.json', JSON.stringify({projectId:process.argv[1],orgId:process.argv[2]}))" "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID"

          node --input-type=module > /tmp/vercel-env.json <<'EOF'
          process.stdout.write(JSON.stringify([{
            key: 'DATABASE_URL',
            value: process.env.DATABASE_URL,
            type: 'encrypted',
            target: ['production', 'preview']
          }]));
          EOF

          ENV_HTTP=$(curl -sS -o /tmp/vercel-env-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/vercel-env.json \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_TEAM_ID")

          if [ "$ENV_HTTP" != "200" ] && [ "$ENV_HTTP" != "201" ]; then
            /tmp/post-status failure "failure/vercel-env-http-$ENV_HTTP" "Vercel environment configuration failed"
            cat /tmp/vercel-env-response.json
            exit 1
          fi

          /tmp/post-status success automation/vercel-provision "Vercel project and DATABASE_URL ready"

      - name: Install and validate application
        shell: bash
        run: |
          set -euo pipefail
          npm install
          NEXT_PUBLIC_SITE_URL=https://acastilho.com.br npm run build
          /tmp/post-status success automation/build "Next.js production build passed"

      - name: Build Vercel artifact
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" -T "$VERCEL_TEAM_ID"
          /tmp/post-status success automation/vercel-pull "Vercel production configuration pulled"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN" -T "$VERCEL_TEAM_ID"
          test -d .vercel/output
          /tmp/post-status success automation/vercel-build "Vercel production artifact built"

      - name: Deploy prebuilt production artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          HIDDEN_GIT=""
          restore_git() {
            if [ -n "$HIDDEN_GIT" ] && [ -d "$HIDDEN_GIT" ] && [ ! -e .git ]; then
              mv "$HIDDEN_GIT" .git
            fi
          }
          trap restore_git EXIT

          if [ -d .git ]; then
            HIDDEN_GIT="/tmp/vercel-hidden-git-${GITHUB_RUN_ID:-$$}"
            rm -rf "$HIDDEN_GIT"
            mv .git "$HIDDEN_GIT"
          fi

          set +e
          OUTPUT=$(npx --yes vercel@latest deploy \
            --prebuilt \
            --prod \
            --archive=tgz \
            --yes \
            --no-color \
            --token="$VERCEL_TOKEN" \
            -T "$VERCEL_TEAM_ID" 2>&1)
          RC=$?
          set -e
          printf '%s\n' "$OUTPUT"

          if [ "$RC" -ne 0 ]; then
            ERROR_LINE=$(printf '%s\n' "$OUTPUT" | grep -Ei 'error|failed|forbidden|unauthorized|limit|permission|access' | tail -n 1 || true)
            [ -n "$ERROR_LINE" ] || ERROR_LINE=$(printf '%s\n' "$OUTPUT" | tail -n 1)
            SLUG=$(printf '%s' "$ERROR_LINE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-65)
            [ -n "$SLUG" ] || SLUG=unknown
            /tmp/post-status failure "failure/deploy-$SLUG" "Vercel production deployment failed"
            exit "$RC"
          fi

          DEPLOYMENT_URL=$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)
          if [ -z "$DEPLOYMENT_URL" ]; then
            /tmp/post-status failure failure/deploy-no-url "Deployment completed without a Vercel URL"
            exit 1
          fi

          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
          echo "- Production: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          /tmp/post-status success automation/deploy "Production deployment created"

      - name: Validate production health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            STATUS=$(curl -L -sS -o /tmp/health.json -w "%{http_code}" "$DEPLOYMENT_URL/api/health" || true)
            if [ "$STATUS" = "200" ]; then
              cat /tmp/health.json
              /tmp/post-status success automation/health "Production health check passed"
              /tmp/post-status success automation/pipeline "Production deploy and health check passed"
              echo "- Health: passed" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS"
            sleep 10
          done
          /tmp/post-status failure "failure/health-http-$STATUS" "Production health check failed"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Mark pipeline failure
        if: failure()
        shell: bash
        run: |
          /tmp/post-status failure automation/pipeline "Automatic deploy failed; inspect failure context"
