name: Provision A Castilho platforms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/projects.json'
      - '.github/workflows/provision-platforms.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: provision-a-castilho-platforms
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_KrFJ87iJN82qsZ56d8eKsvqJ
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_ORG_ID: ${{ vars.NEON_ORG_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare status reporter
        shell: bash
        run: |
          cat > /tmp/post-status <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          state="$1"; context="$2"; description="$3"; target="${4:-}"
          payload=$(node -e 'const x={state:process.argv[1],context:process.argv[2],description:process.argv[3]}; if(process.argv[4]) x.target_url=process.argv[4]; process.stdout.write(JSON.stringify(x))' "$state" "$context" "$description" "$target")
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null
          EOF
          chmod +x /tmp/post-status
          /tmp/post-status pending automation/platforms "Provisioning platforms"

      - name: Validate catalog
        run: node -e "const x=require('./infra/projects.json'); if(!Array.isArray(x.projects)||!x.projects.length) process.exit(1)"

      - name: Ensure Neon projects
        if: ${{ env.NEON_API_KEY != '' && env.NEON_ORG_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install -g neon@latest >/dev/null
          neon projects list --org-id "$NEON_ORG_ID" --output json > /tmp/neon-projects.json
          node <<'NODE' > /tmp/neon-required.txt
          const {projects}=require('./infra/projects.json');
          for (const p of projects.filter(x=>x.neon)) console.log(p.name);
          NODE
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if node - "$name" <<'NODE'
          const fs=require('fs');
          const name=process.argv[2];
          const x=JSON.parse(fs.readFileSync('/tmp/neon-projects.json','utf8'));
          const rows=Array.isArray(x)?x:(x.projects||x.data||[]);
          process.exit(rows.some(p=>p?.name===name)?0:1);
          NODE
            then
              echo "Neon: reuse $name"
            else
              neon projects create --name "$name" --org-id "$NEON_ORG_ID" --database neondb --role neondb_owner --output json >/tmp/neon-created.json
              neon projects list --org-id "$NEON_ORG_ID" --output json > /tmp/neon-projects.json
              echo "Neon: created $name"
            fi
          done < /tmp/neon-required.txt
          /tmp/post-status success automation/neon "Neon projects ready"

      - name: Neon managed externally status
        if: ${{ env.NEON_API_KEY == '' || env.NEON_ORG_ID == '' }}
        run: /tmp/post-status success automation/neon "Neon projects managed through connected Neon account"

      - name: Ensure Vercel projects
        if: ${{ env.VERCEL_TOKEN != '' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/vercel-projects.ndjson
          const {projects}=require('./infra/projects.json');
          for (const p of projects.filter(x=>x.vercel?.enabled)) console.log(JSON.stringify({name:p.name,repo:p.repo,rootDirectory:p.vercel.rootDirectory||undefined}));
          NODE
          while IFS= read -r row; do
            [ -n "$row" ] || continue
            name=$(node -e "const x=JSON.parse(process.argv[1]);process.stdout.write(x.name)" "$row")
            code=$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$name?teamId=$VERCEL_TEAM_ID")
            if [ "$code" = "200" ]; then
              echo "Vercel: reuse $name"
              continue
            fi
            payload=$(node - "$row" <<'NODE'
          const x=JSON.parse(process.argv[2]);
          const body={name:x.name,gitRepository:{type:'github',repo:x.repo}};
          if(x.rootDirectory) body.rootDirectory=x.rootDirectory;
          process.stdout.write(JSON.stringify(body));
          NODE
            )
            code=$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "https://api.vercel.com/v11/projects?teamId=$VERCEL_TEAM_ID")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              cat /tmp/vercel-project.json
              /tmp/post-status failure automation/vercel "Vercel project provisioning isolated; Render continues"
              exit 1
            fi
            echo "Vercel: created $name"
          done < /tmp/vercel-projects.ndjson
          /tmp/post-status success automation/vercel "Vercel projects ready"

      - name: Ensure Render services via REST API
        if: ${{ always() && env.RENDER_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/provision-render.mjs <<'NODE'
          const token = process.env.RENDER_API_KEY;
          const ghToken = process.env.GH_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const api = 'https://api.render.com/v1';
          const headers = {Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          async function req(path, init={}) {
            const r = await fetch(api+path,{...init,headers:{...headers,...(init.headers||{})}});
            const text = await r.text();
            let data=null; try{data=text?JSON.parse(text):null}catch{data=text}
            if(!r.ok){throw new Error(`${init.method||'GET'} ${path} -> ${r.status}: ${typeof data==='string'?data:JSON.stringify(data)}`)}
            return data;
          }
          async function status(state, context, description, target_url) {
            const body={state,context,description}; if(target_url) body.target_url=target_url;
            const r=await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`,{method:'POST',headers:{Authorization:`Bearer ${ghToken}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
            if(!r.ok) throw new Error(`GitHub status ${context} failed: ${r.status}`);
          }
          const owners=await req('/owners?limit=100');
          const ownerRow=Array.isArray(owners)?owners[0]:owners?.data?.[0];
          const ownerId=ownerRow?.owner?.id||ownerRow?.id;
          if(!ownerId) throw new Error('Render workspace could not be resolved');
          const list=await req('/services?limit=100');
          const rows=Array.isArray(list)?list:(list?.data||list?.services||[]);
          const services=new Map(rows.map(x=>{const s=x.service||x; return [s.name,s]}));
          const specs=[
            {name:'devpilot-homolog',type:'web_service',repo:'https://github.com/a-castilho/devpilot',rootDir:'.',serviceDetails:{runtime:'docker',plan:'free',healthCheckPath:'/health',envSpecificDetails:{dockerfilePath:'./Dockerfile',dockerCommand:'uvicorn app.main:app --host 0.0.0.0 --port $PORT'}}},
            {name:'maquinadeleads-homolog-api',type:'web_service',repo:'https://github.com/a-castilho/maquinadeleads',rootDir:'maquina-de-leads/backend',serviceDetails:{runtime:'docker',plan:'free',healthCheckPath:'/health',envSpecificDetails:{dockerfilePath:'./Dockerfile',dockerCommand:'npm start'}}},
            {name:'maquinadeleads-homolog-web',type:'static_site',repo:'https://github.com/a-castilho/maquinadeleads',rootDir:'maquina-de-leads/frontend',serviceDetails:{buildCommand:'npm ci && npm run build',publishPath:'dist'}},
            {name:'telaviva-homolog',type:'static_site',repo:'https://github.com/acastilho/telaviva',rootDir:'preview',serviceDetails:{buildCommand:'echo TelaViva static homologation preview',publishPath:'.'}}
          ];
          for(const spec of specs){
            let s=services.get(spec.name);
            if(!s){
              await status('pending',`render/${spec.name}`,`Creating ${spec.name}`);
              s=await req('/services',{method:'POST',body:JSON.stringify({...spec,ownerId,branch:'main',autoDeploy:'yes'})});
              s=s?.service||s;
            }
            const target=s?.url || (s?.id ? `https://dashboard.render.com/web/${s.id}` : undefined);
            await status('success',`render/${spec.name}`,`${spec.name} provisioned`,target);
            console.log(`${spec.name}: ${target||s?.id||'created'}`);
          }
          await status('success','automation/render','Render services provisioned');
          NODE
          node /tmp/provision-render.mjs

      - name: Missing Render credential
        if: ${{ always() && env.RENDER_API_KEY == '' }}
        run: |
          /tmp/post-status failure automation/render "RENDER_API_KEY missing"
          exit 1

      - name: Final status
        if: ${{ success() }}
        run: /tmp/post-status success automation/platforms "Platform provisioning completed"

      - name: Failure status
        if: ${{ failure() }}
        run: /tmp/post-status failure automation/platforms "Platform provisioning failed"
