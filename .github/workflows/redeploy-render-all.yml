name: Redeploy all Render homologation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redeploy-render-all.yml'

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Trigger all homologation services
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.RENDER_API_KEY;
          if(!token) throw new Error('RENDER_API_KEY missing');
          const api='https://api.render.com/v1';
          async function req(path,init={}){
            const r=await fetch(api+path,{...init,headers:{Authorization:`Bearer ${token}`,Accept:'application/json','Content-Type':'application/json',...(init.headers||{})}});
            const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={message:text}}
            if(!r.ok) throw new Error(`Render ${r.status}: ${data.message||text}`);
            return data;
          }
          const listed=await req('/services?limit=100');
          const rows=Array.isArray(listed)?listed:(listed?.data||listed?.services||[]);
          const services=rows.map(x=>x.service||x).filter(s=>s&&(s.name==='acs'||String(s.name||'').includes('homolog')));
          if(!services.length) throw new Error('No homologation services found');
          console.log(`SERVICES:${services.map(s=>s.name).join(',')}`);
          for(const service of services){
            const deploy=await req(`/services/${service.id}/deploys`,{method:'POST',body:JSON.stringify({clearCache:'do_not_clear'})});
            console.log(`DEPLOY:${service.name}:${deploy?.id||deploy?.deploy?.id||'accepted'}`);
          }
          NODE

      - name: Mark orchestration success
        if: success()
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"homolog/render-redeploy","description":"All visible Render homologation deploys triggered"}' >/dev/null
