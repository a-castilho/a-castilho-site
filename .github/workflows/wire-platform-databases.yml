name: Wire platform databases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-platform-databases.yml'

permissions:
  contents: read
  statuses: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_ORG_ID: org-rapid-wildflower-95055350
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_KrFJ87iJN82qsZ56d8eKsvqJ
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve Neon and wire services
        shell: bash
        run: |
          set -euo pipefail
          npm install -g neon@latest >/dev/null
          neon projects list --org-id "$NEON_ORG_ID" --output json > /tmp/neon-projects.json

          cat > /tmp/wire.mjs <<'NODE'
          import {execFileSync} from 'node:child_process';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const ghToken=process.env.GH_TOKEN, ghRepo=process.env.GITHUB_REPOSITORY, sha=process.env.GITHUB_SHA;
          const renderToken=process.env.RENDER_API_KEY, vercelToken=process.env.VERCEL_TOKEN, team=process.env.VERCEL_TEAM_ID;
          const org=process.env.NEON_ORG_ID;
          async function status(state,context,description,target_url){
            const body={state,context,description:description.slice(0,140)}; if(target_url) body.target_url=target_url;
            await fetch(`https://api.github.com/repos/${ghRepo}/statuses/${sha}`,{method:'POST',headers:{Authorization:`Bearer ${ghToken}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
          }
          const raw=JSON.parse(fs.readFileSync('/tmp/neon-projects.json','utf8'));
          const projects=Array.isArray(raw)?raw:(raw.projects||raw.data||[]);
          function projectId(name){const p=projects.find(x=>x?.name===name); if(!p?.id) throw new Error(`Neon project not found: ${name}`); return p.id}
          function conn(name){
            const id=projectId(name);
            return execFileSync('neon',['connection-string','--project-id',id,'--database-name','neondb','--role-name','neondb_owner','--pooled'],{encoding:'utf8',env:process.env}).trim();
          }
          async function renderReq(path,init={}){
            const r=await fetch(`https://api.render.com/v1${path}`,{...init,headers:{Authorization:`Bearer ${renderToken}`,'Content-Type':'application/json',...(init.headers||{})}});
            const text=await r.text(); let data={}; try{data=text?JSON.parse(text):{}}catch{data={message:text}}
            if(!r.ok) throw new Error(`Render ${r.status}: ${data.message||JSON.stringify(data)}`); return data;
          }
          async function putRenderEnv(service,key,value){
            await renderReq(`/services/${service}/env-vars/${encodeURIComponent(key)}`,{method:'PUT',body:JSON.stringify({value})});
          }
          async function vercelReq(path,init={}){
            const r=await fetch(`https://api.vercel.com${path}`,{...init,headers:{Authorization:`Bearer ${vercelToken}`,'Content-Type':'application/json',...(init.headers||{})}});
            const text=await r.text(); let data={}; try{data=text?JSON.parse(text):{}}catch{data={message:text}}
            if(!r.ok) throw new Error(`Vercel ${r.status}: ${data?.error?.message||data.message||JSON.stringify(data)}`); return data;
          }

          const machineDb=conn('maquinadeleads');
          const machineService='srv-da2c2prm8hqs73ein4e0';
          await putRenderEnv(machineService,'DATABASE_URL',machineDb);
          await putRenderEnv(machineService,'PGSSL','true');
          await putRenderEnv(machineService,'JWT_EXPIRES_IN','7d');
          let jwtExists=false;
          try{await renderReq(`/services/${machineService}/env-vars/JWT_SECRET`);jwtExists=true}catch{}
          if(!jwtExists) await putRenderEnv(machineService,'JWT_SECRET',crypto.randomBytes(48).toString('hex'));
          await renderReq(`/services/${machineService}/deploys`,{method:'POST',body:JSON.stringify({clearCache:'do_not_clear'})});
          await status('success','database/render-maquinadeleads','Neon database wired to Render API','https://dashboard.render.com/web/srv-da2c2prm8hqs73ein4e0');

          const siteDb=conn('a-castilho-site');
          const site=await vercelReq(`/v9/projects/a-castilho-site?teamId=${team}`);
          await vercelReq(`/v10/projects/${site.id}/env?upsert=true&teamId=${team}`,{method:'POST',body:JSON.stringify([{key:'DATABASE_URL',value:siteDb,type:'encrypted',target:['production','preview']}])});
          await status('success','database/vercel-a-castilho-site','Neon database wired to Vercel project','https://vercel.com/maquina-de-leads1/a-castilho-site');
          NODE
          node /tmp/wire.mjs
