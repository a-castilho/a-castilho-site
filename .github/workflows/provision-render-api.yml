name: Deploy ACS to Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'db/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/provision-render-api.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-acs-render-main
  cancel-in-progress: true

jobs:
  deploy-acs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: falling-unit-68011930
      SITE_URL: https://acastilho.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate build
        env:
          NEXT_PUBLIC_SITE_URL: https://acastilho.com.br
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Deploy ACS using existing Neon database
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const renderToken = process.env.RENDER_API_KEY;
          const neonToken = process.env.NEON_API_KEY;
          const ghToken = process.env.GH_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const neonProject = process.env.NEON_PROJECT_ID;
          const siteUrl = process.env.SITE_URL;

          if (!renderToken) throw new Error('RENDER_API_KEY missing');
          if (!neonToken) throw new Error('NEON_API_KEY missing');

          async function status(state, context, description, targetUrl) {
            const body = { state, context, description: description.slice(0, 140) };
            if (targetUrl) body.target_url = targetUrl;
            const response = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${ghToken}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(body)
            });
            if (!response.ok) throw new Error(`GitHub status ${response.status}`);
          }

          async function render(path, init = {}) {
            const response = await fetch(`https://api.render.com/v1${path}`, {
              ...init,
              headers: {
                Authorization: `Bearer ${renderToken}`,
                'Content-Type': 'application/json',
                ...(init.headers || {})
              }
            });
            const text = await response.text();
            let data = {};
            try { data = text ? JSON.parse(text) : {}; } catch { data = { message: text }; }
            if (!response.ok) throw new Error(`Render ${response.status}: ${data.message || JSON.stringify(data)}`);
            return data;
          }

          async function neonConnection() {
            const query = new URLSearchParams({ database_name: 'neondb', role_name: 'neondb_owner', pooled: 'true' });
            const response = await fetch(`https://console.neon.tech/api/v2/projects/${neonProject}/connection_uri?${query}`, {
              headers: { Authorization: `Bearer ${neonToken}`, Accept: 'application/json' }
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.uri) throw new Error(`Neon connection ${response.status}`);
            return data.uri;
          }

          async function putEnv(serviceId, key, value) {
            await render(`/services/${serviceId}/env-vars/${encodeURIComponent(key)}`, {
              method: 'PUT',
              body: JSON.stringify({ value })
            });
          }

          await status('pending', 'acs/render', 'Deploying ACS to Render');
          const databaseUrl = await neonConnection();
          await status('success', 'acs/neon', 'Existing ACS Neon database resolved and preserved');

          const listed = await render('/services?limit=100');
          const rows = Array.isArray(listed) ? listed : (listed?.data || listed?.services || []);
          let service = rows.map(row => row.service || row).find(item => item?.name === 'acs');

          if (!service) {
            const owners = await render('/owners?limit=100');
            const ownerRow = Array.isArray(owners) ? owners[0] : owners?.data?.[0];
            const ownerId = ownerRow?.owner?.id || ownerRow?.id;
            if (!ownerId) throw new Error('Render workspace not found');
            const created = await render('/services', {
              method: 'POST',
              body: JSON.stringify({
                type: 'web_service',
                name: 'acs',
                ownerId,
                repo: 'https://github.com/a-castilho/a-castilho-site',
                branch: 'main',
                autoDeploy: 'no',
                envVars: [
                  { key: 'DATABASE_URL', value: databaseUrl },
                  { key: 'NEXT_PUBLIC_SITE_URL', value: siteUrl }
                ],
                serviceDetails: {
                  runtime: 'node',
                  plan: 'free',
                  healthCheckPath: '/',
                  envSpecificDetails: {
                    buildCommand: 'npm install && npm run build',
                    startCommand: 'npm start'
                  }
                }
              })
            });
            service = created?.service || created;
          } else {
            await putEnv(service.id, 'DATABASE_URL', databaseUrl);
            await putEnv(service.id, 'NEXT_PUBLIC_SITE_URL', siteUrl);
            await render(`/services/${service.id}/deploys`, {
              method: 'POST',
              body: JSON.stringify({ clearCache: 'do_not_clear' })
            });
          }

          if (!service?.id) throw new Error('ACS Render service id missing');
          let detail = await render(`/services/${service.id}`);
          detail = detail?.service || detail;
          const url = detail?.url || detail?.serviceDetails?.url || 'https://acs-3ng6.onrender.com';

          let live = false;
          let code = 0;
          for (let attempt = 0; attempt < 30; attempt++) {
            try {
              const response = await fetch(url, { redirect: 'follow' });
              code = response.status;
              if (response.ok) { live = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!live) throw new Error(`ACS Render HTTP ${code || 'unreachable'}`);

          const logoResponse = await fetch(`${url.replace(/\/$/, '')}/logo-acastilho.svg`, { cache: 'no-store' });
          const logo = await logoResponse.text();
          if (!logoResponse.ok || !logo.includes('três pontas tocando o círculo orbital')) {
            throw new Error('ACS logo smoke test failed');
          }

          const apiResponse = await fetch(`${url.replace(/\/$/, '')}/api/contact`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ website: 'validation-bot' })
          });
          const apiBody = await apiResponse.json().catch(() => ({}));
          if (!apiResponse.ok || apiBody?.ok !== true) throw new Error(`ACS API smoke ${apiResponse.status}`);

          await status('success', 'acs/render', 'ACS logo deployed and site live on Render', url);
          await status('success', 'acs/smoke', 'ACS homepage, logo and API smoke tests passed', url);
          console.log(`ACS_RENDER_URL=${url}`);
          NODE
