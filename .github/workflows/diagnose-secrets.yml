name: Diagnose deployment secrets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          post_status() {
            local state="$1"
            local context="$2"
            local description="$3"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}" >/dev/null
          }

          FAILED=0
          if [ -z "$VERCEL_TOKEN" ]; then
            post_status failure diagnostic/missing-vercel-token "VERCEL_TOKEN is not available to this repository"
            FAILED=1
          else
            post_status success diagnostic/vercel-token "VERCEL_TOKEN is available"
          fi

          if [ -z "$DATABASE_URL" ]; then
            post_status failure diagnostic/missing-database-url "DATABASE_URL is not available to this repository"
            FAILED=1
          else
            post_status success diagnostic/database-url "DATABASE_URL is available"
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          post_status success diagnostic/secrets "All deployment secrets are available"
