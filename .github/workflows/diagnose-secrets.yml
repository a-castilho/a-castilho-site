name: Diagnose deployment secrets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_ORG_ID: ${{ vars.NEON_ORG_ID }}
    steps:
      - name: Check deployment credentials
        shell: bash
        run: |
          set -euo pipefail

          post_status() {
            local state="$1"
            local context="$2"
            local description="$3"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}" >/dev/null
          }

          FAILED=0

          if [ -z "$VERCEL_TOKEN" ]; then
            post_status failure diagnostic/missing-vercel-token "VERCEL_TOKEN is not available"
            FAILED=1
          else
            post_status success diagnostic/vercel-token "VERCEL_TOKEN is available"
          fi

          if [ -n "$NEON_API_KEY" ]; then
            post_status success diagnostic/neon-api-key "NEON_API_KEY is available"
            if [ -n "$NEON_ORG_ID" ]; then
              post_status success diagnostic/neon-org-id "NEON_ORG_ID is available"
            else
              post_status failure diagnostic/missing-neon-org-id "NEON_ORG_ID is required with NEON_API_KEY"
              FAILED=1
            fi
            post_status success diagnostic/database-source-neon "Database will be provisioned by Neon automation"
          elif [ -n "$DATABASE_URL" ]; then
            DB_HASH=$(printf '%s' "$DATABASE_URL" | sha256sum | cut -c1-16)
            post_status success diagnostic/database-url "DATABASE_URL fallback is available"
            post_status success "diagnostic/dbhash-$DB_HASH" "DATABASE_URL fallback fingerprint"
          else
            post_status failure diagnostic/missing-database-credentials "No Neon automation key or DATABASE_URL fallback"
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          post_status success diagnostic/secrets "Deployment credential requirements satisfied"
