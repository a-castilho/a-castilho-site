name: Diagnose deployment automation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_ORG_ID: org-rapid-wildflower-95055350

    steps:
      - name: Check automation credentials
        shell: bash
        run: |
          set -euo pipefail

          post_status() {
            local state="$1"
            local context="$2"
            local description="$3"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}" >/dev/null
          }

          if [ -z "$VERCEL_TOKEN" ]; then
            post_status failure diagnostic/missing-vercel-token "VERCEL_TOKEN is required"
            exit 1
          fi

          post_status success diagnostic/vercel-token "VERCEL_TOKEN is available"

          if [ -n "$NEON_API_KEY" ] && [ -n "$NEON_ORG_ID" ]; then
            post_status success diagnostic/database-strategy-neon-api "Neon API automation available"
          else
            post_status success diagnostic/database-strategy-vercel-neon "Vercel Neon marketplace fallback enabled"
          fi

          post_status success diagnostic/secrets "Automation credential requirements satisfied"
