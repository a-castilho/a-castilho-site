name: Provision missing Render homologation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-missing-render-homolog.yml'

permissions:
  contents: read
  statuses: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RENDER_CLI_VERSION: v2.22.0
    steps:
      - name: Install Render CLI
        shell: bash
        run: |
          set -euo pipefail
          version="${RENDER_CLI_VERSION#v}"
          curl -sSfL "https://github.com/render-oss/cli/releases/download/${RENDER_CLI_VERSION}/cli_${version}_linux_amd64.zip" -o /tmp/render.zip
          unzip -q /tmp/render.zip -d /tmp/render
          sudo find /tmp/render -type f -name 'cli*' -perm -u+x -exec cp {} /usr/local/bin/render \;
          render --version

      - name: Resolve workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          const token=process.env.RENDER_API_KEY;
          const r=await fetch('https://api.render.com/v1/owners?limit=100',{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});
          const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{}
          if(!r.ok) throw new Error(`Render owners ${r.status}: ${text}`);
          const rows=Array.isArray(data)?data:(data?.data||[]);
          const first=rows[0]?.owner||rows[0];
          if(!first?.id) throw new Error('Render workspace not found');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`id=${first.id}\n`);
          console.log(`workspace=${first.name||first.id}`);
          NODE

      - name: Select workspace
        shell: bash
        run: |
          set -euo pipefail
          render workspace set "${{ steps.workspace.outputs.id }}" --output text

      - name: Create DevPilot homologation if missing
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' 'https://api.render.com/v1/services?limit=100' | jq -e '[.[] | (.service // .) | .name] | index("devpilot-homolog") != null' >/dev/null; then
            echo 'devpilot-homolog already exists'
          else
            render services create \
              --output json \
              --type web_service \
              --name devpilot-homolog \
              --repo https://github.com/a-castilho/devpilot \
              --branch main \
              --runtime docker \
              --plan free \
              --health-check-path /health \
              --auto-deploy true \
              --env-var DEVPILOT_ENV=homologation \
              --env-var DEVPILOT_DATA_DIR=/tmp/devpilot \
              --env-var DEVPILOT_REPOSITORIES_DIR=/tmp/devpilot/repositories \
              --env-var DEVPILOT_HOST_ACTIONS_DIR=/tmp/devpilot/host-actions \
              --env-var DEVPILOT_EXECUTION_ENABLED=false \
              --env-var DEVPILOT_EMBEDDED_WORKER=true \
              --env-var DEVPILOT_ALLOWED_GIT_HOSTS=github.com \
              --env-var DEVPILOT_BOOTSTRAP_TOKEN="$(openssl rand -hex 24)" \
              --env-var DEVPILOT_AUTH_SECRET="$(openssl rand -hex 32)" \
              --env-var DEVPILOT_ENCRYPTION_KEY="$(openssl rand -base64 32 | tr -d '\n')"
          fi

      - name: Create RegulaAI Postgres if missing
        shell: bash
        run: |
          set -euo pipefail
          if render pg list --output json | jq -e '.[] | select(.name=="regulaai-homolog-db")' >/dev/null; then
            echo 'regulaai-homolog-db already exists'
          else
            render pg create --confirm --output json --workspace "${{ steps.workspace.outputs.id }}" --name regulaai-homolog-db --database-name regulaai --database-user regulaai --plan free --version 16
          fi

      - name: Read RegulaAI database URL
        id: db
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(render pg get regulaai-homolog-db --include-sensitive-connection-info --output json)
          printf '%s\n' "$JSON" > /tmp/regulaai-db.json
          URL=$(printf '%s' "$JSON" | jq -r '.. | .internalConnectionString? // .internalURL? // .internalUrl? // .connectionString? // empty' | head -n1)
          if [ -z "$URL" ] || [ "$URL" = null ]; then
            echo 'Unable to resolve internal database URL'; cat /tmp/regulaai-db.json; exit 1
          fi
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Create RegulaAI API if missing
        shell: bash
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          set -euo pipefail
          if curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' 'https://api.render.com/v1/services?limit=100' | jq -e '[.[] | (.service // .) | .name] | index("regulaai-homolog-api") != null' >/dev/null; then
            echo 'regulaai-homolog-api already exists'
          else
            render services create \
              --output json \
              --type web_service \
              --name regulaai-homolog-api \
              --repo https://github.com/a-castilho/regulaai \
              --branch main \
              --root-directory backend \
              --runtime docker \
              --plan free \
              --health-check-path / \
              --auto-deploy true \
              --env-var DATABASE_URL="$DATABASE_URL" \
              --env-var REGULAAI_JWT_SECRET="$(openssl rand -hex 32)" \
              --env-var REGULAAI_JWT_ALGORITHM=HS256 \
              --env-var REGULAAI_ACCESS_TOKEN_MINUTES=30 \
              --env-var REGULAAI_REFRESH_TOKEN_DAYS=14 \
              --env-var REGULAAI_WHATSAPP_VERIFY_TOKEN="$(openssl rand -hex 24)"
          fi

      - name: Create RegulaAI web if missing
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' 'https://api.render.com/v1/services?limit=100' | jq -e '[.[] | (.service // .) | .name] | index("regulaai-homolog-web") != null' >/dev/null; then
            echo 'regulaai-homolog-web already exists'
          else
            render services create \
              --output json \
              --type static_site \
              --name regulaai-homolog-web \
              --repo https://github.com/a-castilho/regulaai \
              --branch main \
              --root-directory frontend \
              --build-command 'npm install --no-audit --no-fund && npm run build' \
              --publish-directory dist \
              --auto-deploy true \
              --env-var VITE_API_URL=https://regulaai-homolog-api.onrender.com
          fi

      - name: Wait and verify services
        shell: bash
        run: |
          set -euo pipefail
          check() {
            name="$1"; url="$2"; needle="$3"
            for attempt in $(seq 1 90); do
              code=$(curl -L -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$url" || true)
              if [ "$code" = 200 ] && { [ -z "$needle" ] || grep -qi "$needle" /tmp/body; }; then
                echo "$name ready: $url"
                return 0
              fi
              echo "$name attempt=$attempt http=$code"
              sleep 10
            done
            return 1
          }
          check devpilot https://devpilot-homolog.onrender.com/health devpilot
          check regulaai-api https://regulaai-homolog-api.onrender.com/ online
          check regulaai-web https://regulaai-homolog-web.onrender.com/ RegulaAI

      - name: Publish success status
        if: success()
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"homolog/provision-missing","description":"DevPilot and RegulaAI Render homologation ready"}' >/dev/null
