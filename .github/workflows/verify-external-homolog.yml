name: Verify external homologation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-external-homolog.yml'

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify DevPilot and RegulaAI homologation
        shell: bash
        run: |
          set -u
          check() {
            NAME="$1"
            URL="$2"
            EXPECT="$3"
            OK=0
            CODE=0
            for attempt in $(seq 1 30); do
              CODE=$(curl -L -sS -o /tmp/check-body -w '%{http_code}' --max-time 20 "$URL" || true)
              if [ "$CODE" = "200" ]; then
                if [ -z "$EXPECT" ] || grep -qi "$EXPECT" /tmp/check-body; then
                  OK=1
                  break
                fi
              fi
              sleep 10
            done
            if [ "$OK" = "1" ]; then STATE=success; DESC="$NAME online HTTP 200"; else STATE=failure; DESC="$NAME unavailable HTTP $CODE"; fi
            PAYLOAD=$(node -e 'console.log(JSON.stringify({state:process.argv[1],context:process.argv[2],description:process.argv[3],target_url:process.argv[4]}))' "$STATE" "homolog/external/$NAME" "$DESC" "$URL")
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$PAYLOAD" >/dev/null
            [ "$OK" = "1" ]
          }

          FAIL=0
          check devpilot https://devpilot-homolog.onrender.com/health devpilot || FAIL=1
          check regulaai-api https://regulaai-homolog-api.onrender.com/ online || FAIL=1
          check regulaai-web https://regulaai-homolog-web.onrender.com/ RegulaAI || FAIL=1
          exit "$FAIL"
