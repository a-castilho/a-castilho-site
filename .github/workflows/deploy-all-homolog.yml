name: Deploy all homologation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-all-homolog.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-all-homologation
  cancel-in-progress: false

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark Render deployment pending
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"homolog/render-all","description":"Deploying all homologation services on Render"}' >/dev/null

      - name: Validate Render access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo "::error::RENDER_API_KEY is not configured"; exit 1; }
          curl --fail --show-error --silent \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?limit=1" >/dev/null

      - name: Deploy all homologation services
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/deploy-all.mjs <<'NODE'
          const token = process.env.RENDER_API_KEY;
          const api = 'https://api.render.com/v1';
          const wanted = new Set([
            'acs',
            'devpilot-homolog',
            'regulaai-homolog-api',
            'regulaai-homolog-web',
            'maquinadeleads-homolog-api',
            'maquinadeleads-homolog-web',
          ]);

          async function req(path, init = {}) {
            const response = await fetch(api + path, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/json',
                'Content-Type': 'application/json',
                ...(init.headers || {}),
              },
            });
            const text = await response.text();
            let data = {};
            try { data = text ? JSON.parse(text) : {}; } catch { data = { message: text }; }
            if (!response.ok) throw new Error(`${path}: Render ${response.status} ${data.message || text}`);
            return data;
          }

          const listed = await req('/services?limit=100');
          const rows = Array.isArray(listed) ? listed : (listed?.data || listed?.services || []);
          const services = rows.map((row) => row.service || row).filter(Boolean);
          const found = new Map(services.filter((service) => wanted.has(service.name)).map((service) => [service.name, service]));
          const missing = [...wanted].filter((name) => !found.has(name));
          if (missing.length) throw new Error(`Render services not found: ${missing.join(', ')}`);

          for (const [name, service] of found) {
            console.log(`Deploying ${name} (${service.id})`);
            const deploy = await req(`/services/${service.id}/deploys`, {
              method: 'POST',
              body: JSON.stringify({ clearCache: 'do_not_clear' }),
            });
            const deployId = deploy?.id || deploy?.deploy?.id;
            console.log(`${name}: deploy=${deployId || 'accepted'}`);
          }
          console.log(`Triggered ${found.size}/${wanted.size} Render homologation services.`);
          NODE
          node /tmp/deploy-all.mjs

      - name: Mark Render deployment result
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then STATE=success; DESC='All Render homologation deploys triggered'; else STATE=failure; DESC='One or more Render homologation deploys failed'; fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"$STATE\",\"context\":\"homolog/render-all\",\"description\":\"$DESC\"}" >/dev/null

  deploy-regulaai-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      VERCEL_TEAM_ID: team_KrFJ87iJN82qsZ56d8eKsvqJ
      VERCEL_PROJECT_ID: prj_JzhYNVEjf7DKdTTZRzn9ydANzgMS
      REGULAAI_REPO_ID: '1334784738'
    steps:
      - name: Mark Vercel deployment pending
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"homolog/regulaai-vercel","description":"Deploying RegulaAI frontend to Vercel"}' >/dev/null

      - name: Deploy latest RegulaAI main to Vercel
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN is not configured"; exit 1; }
          cat > /tmp/vercel-deploy.mjs <<'NODE'
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_TEAM_ID;
          const project = process.env.VERCEL_PROJECT_ID;
          const repoId = Number(process.env.REGULAAI_REPO_ID);
          const response = await fetch(`https://api.vercel.com/v13/deployments?teamId=${encodeURIComponent(teamId)}`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: 'regulaai',
              project,
              target: 'production',
              gitSource: { type: 'github', repoId, ref: 'main' }
            })
          });
          const text = await response.text();
          let data = {};
          try { data = text ? JSON.parse(text) : {}; } catch { data = { message: text }; }
          if (!response.ok) throw new Error(`Vercel ${response.status}: ${data.error?.message || data.message || text}`);
          const deploymentId = data.id;
          const url = data.url;
          if (!deploymentId) throw new Error('Vercel deployment id missing');
          console.log(`RegulaAI Vercel deployment: ${deploymentId} ${url || ''}`);

          for (let attempt = 1; attempt <= 90; attempt++) {
            await new Promise((resolve) => setTimeout(resolve, 5000));
            const check = await fetch(`https://api.vercel.com/v13/deployments/${deploymentId}?teamId=${encodeURIComponent(teamId)}`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            const current = await check.json().catch(() => ({}));
            const state = current.readyState || current.status;
            console.log(`Vercel state ${attempt}: ${state || 'unknown'}`);
            if (state === 'READY') process.exit(0);
            if (['ERROR', 'CANCELED'].includes(state)) throw new Error(`Vercel deployment ended as ${state}`);
          }
          throw new Error('Vercel deployment timeout');
          NODE
          node /tmp/vercel-deploy.mjs

      - name: Mark Vercel deployment result
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then STATE=success; DESC='RegulaAI frontend deployed to Vercel'; else STATE=failure; DESC='RegulaAI Vercel deployment failed'; fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"$STATE\",\"context\":\"homolog/regulaai-vercel\",\"description\":\"$DESC\"}" >/dev/null
