name: Deploy all homologation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-all-homolog.yml'

permissions:
  contents: read

concurrency:
  group: deploy-all-homologation
  cancel-in-progress: false

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Validate Render access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo "::error::RENDER_API_KEY is not configured"; exit 1; }
          curl --fail --show-error --silent \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?limit=1" >/dev/null

      - name: Deploy all homologation services
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/deploy-all.mjs <<'NODE'
          const token = process.env.RENDER_API_KEY;
          const api = 'https://api.render.com/v1';
          const wanted = new Set([
            'acs',
            'devpilot-homolog',
            'regulaai-homolog-api',
            'regulaai-homolog-web',
            'maquinadeleads-homolog-api',
            'maquinadeleads-homolog-web',
          ]);

          async function req(path, init = {}) {
            const response = await fetch(api + path, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/json',
                'Content-Type': 'application/json',
                ...(init.headers || {}),
              },
            });
            const text = await response.text();
            let data = {};
            try { data = text ? JSON.parse(text) : {}; } catch { data = { message: text }; }
            if (!response.ok) throw new Error(`${path}: Render ${response.status} ${data.message || text}`);
            return data;
          }

          const listed = await req('/services?limit=100');
          const rows = Array.isArray(listed) ? listed : (listed?.data || listed?.services || []);
          const services = rows.map((row) => row.service || row).filter(Boolean);
          const found = new Map(services.filter((service) => wanted.has(service.name)).map((service) => [service.name, service]));

          const missing = [...wanted].filter((name) => !found.has(name));
          if (missing.length) console.log(`::warning::Render services not found: ${missing.join(', ')}`);

          for (const [name, service] of found) {
            console.log(`Deploying ${name} (${service.id})`);
            await req(`/services/${service.id}/deploys`, {
              method: 'POST',
              body: JSON.stringify({ clearCache: 'do_not_clear' }),
            });
          }

          const summary = `Triggered ${found.size}/${wanted.size} Render homologation services.`;
          console.log(summary);
          NODE
          node /tmp/deploy-all.mjs
