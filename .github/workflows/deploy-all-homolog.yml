name: Deploy all homologation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-all-homolog.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-all-homologation
  cancel-in-progress: false

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Deploy Render homologation services
        shell: bash
        run: |
          set -u
          RESULT=$(node <<'NODE' 2>&1
          const token = process.env.RENDER_API_KEY;
          if (!token) { console.log('ERROR: RENDER_API_KEY missing'); process.exit(1); }
          const api = 'https://api.render.com/v1';
          async function req(path, init = {}) {
            const response = await fetch(api + path, {
              ...init,
              headers: {Authorization: `Bearer ${token}`, Accept:'application/json', 'Content-Type':'application/json', ...(init.headers||{})}
            });
            const text = await response.text();
            let data = {};
            try { data = text ? JSON.parse(text) : {}; } catch { data = {message:text}; }
            if (!response.ok) throw new Error(`Render ${response.status}: ${data.message || text}`);
            return data;
          }
          try {
            const listed = await req('/services?limit=100');
            const rows = Array.isArray(listed) ? listed : (listed?.data || listed?.services || []);
            const services = rows.map(r => r.service || r).filter(Boolean);
            const targets = services.filter(s => s.name === 'acs' || String(s.name||'').includes('homolog'));
            if (!targets.length) throw new Error('No homologation services found in Render workspace');
            console.log(`SERVICES:${targets.map(s=>s.name).join(',')}`);
            for (const service of targets) {
              const deploy = await req(`/services/${service.id}/deploys`, {method:'POST', body:JSON.stringify({clearCache:'do_not_clear'})});
              console.log(`DEPLOY:${service.name}:${deploy?.id || deploy?.deploy?.id || 'accepted'}`);
            }
          } catch (error) {
            console.log(`ERROR:${String(error.message || error).replace(/\s+/g,' ').slice(0,120)}`);
            process.exit(1);
          }
          NODE
          )
          CODE=$?
          echo "$RESULT"
          DESC=$(printf '%s' "$RESULT" | tail -n 1 | tr -d '\r' | cut -c1-120)
          [ -n "$DESC" ] || DESC='Render deploy result unavailable'
          if [ "$CODE" -eq 0 ]; then STATE=success; else STATE=failure; fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(node -e 'console.log(JSON.stringify({state:process.argv[1],context:"homolog/render-all",description:process.argv[2]}))' "$STATE" "$DESC")" >/dev/null
          exit "$CODE"

  deploy-regulaai-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      VERCEL_TEAM_ID: team_KrFJ87iJN82qsZ56d8eKsvqJ
      VERCEL_PROJECT_ID: prj_JzhYNVEjf7DKdTTZRzn9ydANzgMS
      REGULAAI_REPO_ID: '1334784738'
    steps:
      - name: Deploy latest RegulaAI main to Vercel
        shell: bash
        run: |
          set -u
          RESULT=$(node <<'NODE' 2>&1
          const token = process.env.VERCEL_TOKEN;
          if (!token) { console.log('ERROR: VERCEL_TOKEN missing'); process.exit(1); }
          const teamId = process.env.VERCEL_TEAM_ID;
          const project = process.env.VERCEL_PROJECT_ID;
          const repoId = Number(process.env.REGULAAI_REPO_ID);
          try {
            const response = await fetch(`https://api.vercel.com/v13/deployments?teamId=${encodeURIComponent(teamId)}`, {
              method:'POST',
              headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
              body:JSON.stringify({name:'regulaai',project,target:'production',gitSource:{type:'github',repoId,ref:'main'}})
            });
            const text = await response.text();
            let data={}; try{data=text?JSON.parse(text):{}}catch{data={message:text}}
            if(!response.ok) throw new Error(`Vercel ${response.status}: ${data.error?.message || data.message || text}`);
            const id=data.id; if(!id) throw new Error('Vercel deployment id missing');
            console.log(`DEPLOY:${id}:${data.url || ''}`);
            for(let attempt=1; attempt<=90; attempt++){
              await new Promise(r=>setTimeout(r,5000));
              const check=await fetch(`https://api.vercel.com/v13/deployments/${id}?teamId=${encodeURIComponent(teamId)}`,{headers:{Authorization:`Bearer ${token}`}});
              const current=await check.json().catch(()=>({}));
              const state=current.readyState || current.status;
              if(state==='READY'){console.log(`READY:${current.url || data.url || id}`);process.exit(0)}
              if(['ERROR','CANCELED'].includes(state)) throw new Error(`Deployment ${state}: ${current.errorMessage || current.errorCode || ''}`);
            }
            throw new Error('Vercel deployment timeout');
          } catch(error) {
            console.log(`ERROR:${String(error.message || error).replace(/\s+/g,' ').slice(0,120)}`);
            process.exit(1);
          }
          NODE
          )
          CODE=$?
          echo "$RESULT"
          DESC=$(printf '%s' "$RESULT" | tail -n 1 | tr -d '\r' | cut -c1-120)
          [ -n "$DESC" ] || DESC='Vercel deploy result unavailable'
          if [ "$CODE" -eq 0 ]; then STATE=success; else STATE=failure; fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(node -e 'console.log(JSON.stringify({state:process.argv[1],context:"homolog/regulaai-vercel",description:process.argv[2]}))' "$STATE" "$DESC")" >/dev/null
          exit "$CODE"
