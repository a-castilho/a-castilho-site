<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ACS</title>
  <desc id="desc">Letra A geométrica azul integrada a um círculo orbital, identidade visual da ACS.</desc>
  <defs>
